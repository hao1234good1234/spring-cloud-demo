# ========================
# Seata 配置：AT 模式（推荐）
# ========================
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: my_at_tx_group   # ✅ 统一事务组名
  service:
    vgroup-mapping:
      my_at_tx_group: default
    grouplist:
      default: 192.168.43.204:8091
  # ========================
  # Seata 配置中心（Nacos）
  # ========================
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: ${NACOS_NAMESPACE:dev-ns-id}
      group: SEATA_GROUP
      data-id: seata-server.properties  # ✅ 客户端配置文件

  # ========================
  # Seata 注册中心（Nacos）
  # ========================
  registry:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: ${NACOS_NAMESPACE:dev-ns-id}
      group: SEATA_GROUP
      application: seata-server
      cluster: default

  # ========================
  # Seata 客户端配置
  # ========================
  client:
    rm:
      report-success-enable: true
    # ✅ 显式指定本机 IP 和端口（每台机器不同）
